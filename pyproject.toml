[build-system]
requires = ["setuptools>=68.0", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "torchgwas"
version = "0.3.8"
description = "GPU-accelerated Genome-Wide Association Studies with PyTorch"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Sikiru Atanda", email = "sikiru-atanda@github.com"},
]
keywords = ["GWAS", "genomics", "PyTorch", "GPU", "association-studies", "polyploid"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.0,<2.5",
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "requests>=2.28",
]

[project.optional-dependencies]
zarr = ["zarr>=2.14"]
hdf5 = ["h5py>=3.8"]
parquet = ["pyarrow>=12.0"]
plot = ["seaborn>=0.12"]
all = [
    "zarr>=2.14",
    "h5py>=3.8",
    "pyarrow>=12.0",
    "seaborn>=0.12",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.1",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "zarr>=2.14",
    "h5py>=3.8",
    "pyarrow>=12.0",
    "seaborn>=0.12",
    "statsmodels>=0.14",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]
polyploid-phase = ["juliacall>=0.9"]

[project.scripts]
torchgwas = "torchgwas.cli:main"

[project.urls]
Repository = "https://github.com/sikiru-atanda/torchgwas"
Documentation = "https://sikiru-atanda.github.io/torchgwas/"
Issues = "https://github.com/sikiru-atanda/torchgwas/issues"

[tool.setuptools.packages.find]
include = ["torchgwas*"]

[tool.setuptools.package-data]
"torchgwas._native" = ["*.pyi"]
"torchgwas.preprocess" = ["juliapkg.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "golden: golden reference tests against GEMMA/GAPIT/GWASpoly",
    "slow: tests that take more than 30 seconds",
    "gpu: tests that require a CUDA device",
    "external: tests that install + run external reference tools (Pillar B)",
    "timeout: per-test or per-module timeout (requires pytest-timeout)",
    "cli_matrix: end-to-end CLI smoke matrix (Pillar C; opt-in via -m cli_matrix)",
    "reproducibility: Pillar D fixture-drift audit (opt-in via -m reproducibility)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# Stylistic rules we don't enforce on a scientific codebase — they catch
# opinion, not bugs. Kept real bug-catchers (F401, F811, F821, B006, B008,
# E9xx). Rationale per rule:
#   E402 — some modules set env vars before importing torch (legitimate).
#   E501 — scientific code routinely has long array-literal / docstring lines.
#   E702 — inline `import; x = ...` is common in short test stubs.
#   E741 — `l`, `I`, `O` are standard in linear-algebra shorthand.
#   F841 — test locals often capture intermediates for clarity.
#   B007 — `for _ in range(n):` style is common; rename isn't always worth it.
#   B011 — `assert False, "msg"` is fine in unreachable branches.
#   B017 — pytest.raises(Exception) is used when specificity is tested elsewhere.
#   B023 — closures used within the same loop iteration aren't leaking late-binding.
#   B028 — warnings.warn without stacklevel isn't wrong, just less informative.
#   B904 — exception chaining is orthogonal; many re-raises don't need `from`.
#   B905 — zip(strict=True) is a 3.10+ stylistic preference.
#   SIM* — ternary / if-exp simplifications are subjective.
#   UP0xx remaining — PEP-604 union syntax preference, not load-bearing.
ignore = [
    "E402", "E501", "E702", "E741",
    "F841",
    "B007", "B011", "B017", "B023", "B028", "B904", "B905",
    "SIM102", "SIM105", "SIM108", "SIM113", "SIM115", "SIM300", "SIM910",
    "UP006", "UP007", "UP035", "UP037", "UP045",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.cibuildwheel]
# Phase C.4 — build native-extension wheels for every supported CPython on
# manylinux2014 (Linux x86_64) and win_amd64. The pybind11 extensions link
# against the CPU-build torch headers but the resulting wheels work with
# either CPU or GPU torch at runtime (torch.extension.h is runtime-agnostic).
build = "cp310-* cp311-* cp312-*"
skip = "pp* *-musllinux_* *-win32 *-manylinux_i686"
build-verbosity = 1
# Dependencies needed to build the native extensions:
#   - pybind11 exports its CMake / header location via `pybind11.get_include()`
#   - numpy headers are pulled in by torch's extension machinery on some platforms
#   - torch supplies `torch/extension.h` used by every `csrc/` module
before-build = "pip install pybind11>=2.11 numpy torch"
test-requires = ["pytest>=7.0"]
test-command = "python -c \"from torchgwas import __version__; print('torchgwas', __version__, 'wheel install ok')\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
archs = ["x86_64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
# macOS-specific: OpenMP requires libomp (brew install libomp). Disable for
# pre-built wheels so users on stock macOS toolchains aren't surprised.
environment = { TORCHGWAS_DISABLE_OPENMP = "1" }
