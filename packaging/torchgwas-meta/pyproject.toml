[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchgwas"
version = "0.4.0"
description = "Deprecated alias for torchgenomics. Use `pip install torchgenomics` instead."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Sikiru Atanda", email = "sikiru-atanda@github.com"},
]
keywords = ["GWAS", "genomics", "PyTorch", "deprecated", "alias"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Pinned to the matching torchgenomics release. Users upgrading the
# shim get the full torchgenomics runtime automatically.
dependencies = [
    "torchgenomics==0.4.0",
]

[project.scripts]
torchgwas = "torchgwas._legacy_cli:main"

[project.urls]
Repository = "https://github.com/sikiru-atanda/torchgenomics"
Documentation = "https://sikiru-atanda.github.io/torchgenomics/"
Issues = "https://github.com/sikiru-atanda/torchgenomics/issues"

[tool.setuptools.packages.find]
include = ["torchgwas*"]
