name: GPU tests

# Validates that CUDA paths agree with CPU paths numerically and that the
# dedicated GPU imputation kernels pass. Kept separate from the main CI
# matrix because GPU runners are slower to schedule and cost-sensitive.
#
# Triggers:
#   - push to master / main (after merge)
#   - weekly cron (Mondays 04:00 UTC) to catch drift on quiet weeks
#   - manual dispatch for targeted investigation
#
# Runner: GitHub-hosted NVIDIA A10G ("runs-on: gpu"). If your org uses a
# self-hosted fleet, swap in `runs-on: [self-hosted, linux, gpu]`.

on:
  push:
    branches: [master, main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  gpu-tests:
    name: CUDA parity + dedicated GPU kernels
    runs-on: gpu
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify CUDA runtime visibility
        run: |
          nvidia-smi

      - name: Install CUDA-build PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cu121

      - name: Install torchgwas + dev deps
        run: |
          pip install pybind11>=2.11
          pip install -e ".[dev]"

      - name: Confirm CUDA is available to torch
        run: |
          python -c "import torch; assert torch.cuda.is_available(), 'CUDA not visible to torch'; print('CUDA:', torch.version.cuda, '| device:', torch.cuda.get_device_name(0))"

      - name: Run CUDA-gated imputation kernel parity
        run: |
          pytest tests/test_impute_gpu_kernels.py -v --tb=short --timeout=600

      - name: Run CPU↔GPU model-scan parity
        run: |
          pytest tests/test_gpu_model_parity.py -v --tb=short --timeout=900

      - name: Smoke CLI on CUDA
        run: |
          python -c "from torchgwas.cli import main; print('CLI import ok on GPU node')"
          torchgwas --version
