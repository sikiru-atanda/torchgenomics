name: GPU tests

# NA2 — GPU CI on PRs (infra)
#
# Validates that CUDA paths agree with CPU paths numerically and that the
# dedicated GPU imputation kernels pass. Runs on a self-hosted runner backed
# by an NVIDIA RTX 2000 Ada Generation (16 GB VRAM) physically attached to
# the maintainer's workstation.
#
# Triggers and security model:
#
#   1. pull_request_target with label gating ("gpu-tested")
#      ----------------------------------------------------
#      We use `pull_request_target` (NOT `pull_request`) deliberately.
#
#      `pull_request` checks out PR head code and runs it with the FORK's
#      view of the workflow file. On a self-hosted runner that is a remote
#      code execution primitive — any community contributor could rewrite
#      this workflow and execute arbitrary commands on the maintainer's
#      hardware (with whatever GPU and host filesystem access the runner
#      has). See:
#        https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
#        https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
#
#      `pull_request_target` instead runs the workflow file from the BASE
#      branch (master) and grants the workflow access to repository
#      secrets. The PR head is checked out only after a maintainer has
#      reviewed the diff and applied the `gpu-tested` label. The label
#      gate (`if: contains(github.event.pull_request.labels.*.name, ...)`)
#      ensures the job is skipped for unlabeled PRs.
#
#      WARNING: when checking out PR head code under `pull_request_target`,
#      we must NOT expose secrets to that code. This workflow does not
#      mount any secrets into the install/test steps. If a future change
#      adds secrets, audit it against
#      https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication
#
#   2. schedule (nightly cron, 04:00 UTC)
#      ----------------------------------
#      Catches drift on master between merges. Runs against master HEAD
#      with no checkout-of-untrusted-code risk.
#
#   3. workflow_dispatch
#      -----------------
#      Manual trigger for targeted investigation. Maintainer-only by
#      default (requires write access to the repo).
#
# Runner labels:
#
#   `[self-hosted, gpu, rtx-2000-ada]` — the dedicated workstation runner
#   registers with all three labels. The GPU job requires all three so a
#   misconfigured runner cannot accidentally pick up the job.
#
# Per-job ephemerality:
#
#   The runner is registered with `--ephemeral`, which means it processes
#   one job and then deregisters. The systemd unit then re-registers a
#   fresh runner. This bounds the blast radius of a compromised job to a
#   single workflow run; persistent state poisoning across PRs is not
#   possible. See:
#     https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners/autoscaling-with-self-hosted-runners#using-ephemeral-runners-for-autoscaling

on:
  pull_request_target:
    types: [labeled, synchronize, reopened]
    branches: [master, main]
  schedule:
    # 04:00 UTC nightly — well outside the maintainer's working hours
    # (US Central business hours) so a long run does not contend with
    # interactive workstation use.
    - cron: "0 4 * * *"
  workflow_dispatch:

# Cancel in-flight GPU runs on the same PR when a new commit is pushed —
# saves runner time and avoids GPU OOM from concurrent jobs.
concurrency:
  group: gpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gpu-tests:
    name: CUDA parity + dedicated GPU kernels
    # Skip unless the PR carries `gpu-tested` (or unless the trigger is
    # the nightly schedule / manual dispatch, which are maintainer-only).
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       contains(github.event.pull_request.labels.*.name, 'gpu-tested'))
    runs-on: [self-hosted, gpu, rtx-2000-ada]
    timeout-minutes: 60
    steps:
      # For pull_request_target, github.sha points at the BASE commit of
      # the PR. To run the PR's own code we must explicitly check out the
      # head ref. Per GitHub's hardening guide this is the moment we are
      # accepting untrusted code; nothing after this step should be trusted
      # to be benign, and no secrets are injected into the environment of
      # the steps that follow.
      - name: Checkout PR head (untrusted) or master (scheduled)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Persist credentials only for the duration of checkout; do not
          # leave them on disk for later steps to use.
          persist-credentials: false

      - name: Pre-flight — confirm GPU runner identity
        run: |
          set -euo pipefail
          echo "::group::Runner host"
          hostname
          uname -a
          echo "::endgroup::"

          echo "::group::nvidia-smi"
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "::error::nvidia-smi not found on PATH. This runner is mis-labeled as 'gpu'."
            exit 1
          fi
          nvidia-smi
          echo "::endgroup::"

          echo "::group::Device identity check"
          # The dedicated runner is an RTX 2000 Ada. Other GPU runners
          # (if added later) should pass this check too — we match on the
          # 'NVIDIA' vendor + presence of any CUDA-capable device.
          DEVICE_NAME="$(nvidia-smi --query-gpu=name --format=csv,noheader | head -1)"
          if [ -z "${DEVICE_NAME}" ]; then
            echo "::error::nvidia-smi returned no devices."
            exit 1
          fi
          echo "Detected GPU: ${DEVICE_NAME}"
          if ! echo "${DEVICE_NAME}" | grep -qi "RTX 2000 Ada"; then
            echo "::warning::GPU is not the expected 'NVIDIA RTX 2000 Ada Generation'. Continuing."
          fi
          echo "::endgroup::"

      - name: Pre-flight — initial VRAM snapshot
        run: |
          mkdir -p artifacts
          nvidia-smi --query-gpu=timestamp,name,memory.used,memory.free,memory.total \
            --format=csv > artifacts/vram-before.csv
          cat artifacts/vram-before.csv

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CUDA-build PyTorch
        run: |
          python -m pip install --upgrade pip
          # Pin to the validated torch range. cu121 wheels are the lowest
          # common denominator that works against driver 535+; the host
          # driver here is 580 / CUDA 13.0 which is forward-compatible.
          pip install "torch>=2.0,<2.5" "numpy<2.0" \
            --index-url https://download.pytorch.org/whl/cu121 \
            --extra-index-url https://pypi.org/simple

      - name: Install torchgwas + dev deps
        run: |
          pip install "pybind11>=2.11"
          pip install -e ".[dev]"

      - name: Confirm CUDA is available to torch
        run: |
          python - <<'PY'
          import torch
          assert torch.cuda.is_available(), "CUDA not visible to torch"
          name = torch.cuda.get_device_name(0)
          props = torch.cuda.get_device_properties(0)
          print(f"CUDA version: {torch.version.cuda}")
          print(f"Device:       {name}")
          print(f"VRAM total:   {props.total_memory / (1024**3):.2f} GiB")
          # We require >= 8 GiB VRAM so the parity tests have headroom.
          assert props.total_memory >= 8 * (1024**3), \
              f"Insufficient VRAM: {props.total_memory / (1024**3):.2f} GiB"
          # Catch silent CPU fallback: actually execute a CUDA op end-to-end
          # (a bug in driver/runtime/torch wheel could leave is_available()
          # True but ops silently fall back). One round-trip is enough.
          x = torch.ones(8, device="cuda")
          y = (x * 2.0 + 1.0).sum()
          assert y.device.type == "cuda", f"CUDA op fell back to {y.device}"
          assert float(y.cpu()) == 8 * 3.0, f"CUDA op returned wrong value: {float(y.cpu())}"
          print(f"CUDA op test: ok (sum = {float(y.cpu()):.1f})")
          PY

      - name: Run GPU-marked tests + GPU test files (with JUnit XML)
        # We invoke pytest twice so unmarked-but-CUDA-skipif tests under
        # tests/test_gpu*.py also run. The `gpu` marker is registered in
        # pyproject.toml but not yet applied to every CUDA test (legacy
        # convention is `@pytest.mark.skipif(not HAS_CUDA, ...)`); the
        # explicit file path catches them. Duplicates are deduplicated by
        # pytest's collection.
        run: |
          set -o pipefail
          mkdir -p artifacts
          pytest \
            -m gpu \
            tests/test_gpu.py \
            tests/test_gpu_model_parity.py \
            tests/test_impute_gpu.py \
            tests/test_impute_gpu_kernels.py \
            -v --tb=short \
            --timeout=900 \
            --junitxml=artifacts/junit-gpu.xml \
            | tee artifacts/pytest-gpu.log

      - name: Post-flight — final VRAM snapshot
        if: always()
        run: |
          mkdir -p artifacts
          nvidia-smi --query-gpu=timestamp,name,memory.used,memory.free,memory.total \
            --format=csv > artifacts/vram-after.csv
          cat artifacts/vram-after.csv

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-test-artifacts-${{ github.event.pull_request.number || github.run_id }}
          path: artifacts/
          retention-days: 14

      - name: Smoke CLI on CUDA
        run: |
          python -c "from torchgwas.cli import main; print('CLI import ok on GPU node')"
          torchgwas --version
