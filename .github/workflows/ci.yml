name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check torchgwas/ tests/

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -x -q --timeout=300
        env:
          TORCHGWAS_DISABLE_NATIVE: "1"

  golden:
    name: Golden reference tests (GEMMA/GWASpoly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run golden reference tests
        run: |
          pytest tests/ -m golden -v --tb=short --timeout=600
        env:
          TORCHGWAS_DISABLE_NATIVE: "1"

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with native extensions
        run: |
          python -m pip install --upgrade pip
          pip install pybind11>=2.11
          pip install -e ".[dev]"

      - name: Run tests with native accelerators
        run: |
          pytest tests/ -v --tb=short -x -q --timeout=300

  test-no-openmp:
    name: Native build without OpenMP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build native extensions with OpenMP disabled
        env:
          TORCHGWAS_DISABLE_OPENMP: "1"
        run: |
          python -m pip install --upgrade pip
          pip install pybind11>=2.11
          pip install -e ".[dev]"

      - name: Run tests with OpenMP disabled
        env:
          TORCHGWAS_DISABLE_OPENMP: "1"
        run: |
          pytest tests/ -v --tb=short -x -q --timeout=300

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check with mypy
        run: |
          mypy torchgwas/ --ignore-missing-imports
        continue-on-error: true
