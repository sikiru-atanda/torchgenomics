name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build torchgenomics sdist (no native extensions)
        run: |
          python -m build --sdist
          ls -lh dist/

      - name: Build torchgwas meta-package (universal wheel + sdist)
        run: |
          cd packaging/torchgwas-meta
          python -m build
          # Stage meta-package artifacts alongside the main package.
          cp dist/* ../../dist/
          ls -lh ../../dist/

      - name: Check both distributions
        run: |
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.release.prerelease
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish both packages to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: "!github.event.release.prerelease"
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish both packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-shim:
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: "!github.event.release.prerelease"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Wait for PyPI index propagation
        run: sleep 60

      - name: Install torchgwas from PyPI (should pull torchgenomics)
        run: |
          python -m pip install --upgrade pip
          pip install "torchgwas==0.4.0"
          pip list | grep -E "^torch(genomics|gwas)"

      - name: Smoke-test the deprecation shim
        run: |
          python -W default -c "
          import torchgwas
          print('torchgwas:', torchgwas.__version__)
          import torchgenomics
          print('torchgenomics:', torchgenomics.__version__)
          assert torchgwas.__version__ == torchgenomics.__version__
          from torchgwas.models import SingleTraitLMM as A
          from torchgenomics.models import SingleTraitLMM as B
          assert A is B, 'shim must resolve to torchgenomics module objects'
          print('Shim verified end-to-end.')
          "
