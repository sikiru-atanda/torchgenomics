# paper/manuscript/full_draft.md once D3.14 lands.
manuscript_file_planned: "paper/manuscript/full_draft.pdf"

# Figures: include F1-F7 + the supplementary panels (S1-S7 documents +
# the future S8 demo notebooks). All are regenerable via
# `bash paper/reproducibility/reproduce_paper.sh`.
figures_planned:
  main:
    - "paper/reproducibility/output/F1.pdf  -- Capability map (11 clusters, 121 capabilities)"
    - "paper/reproducibility/output/F2.pdf  -- 11-harness equivalence grid (40/45 PASS)"
    - "paper/reproducibility/output/F3.pdf  -- Haplotype layer (LD-block design + haplotype GWAS)"
    - "paper/reproducibility/output/F4.pdf  -- Multi-omics integration (SORT1 worked example)"
    - "paper/reproducibility/output/F5.pdf  -- Polyploid pipeline (k=4/6/8 demo)"
    - "paper/reproducibility/output/F6.pdf  -- GPU + biobank streaming (8.7x at p=1e6)"
    - "paper/reproducibility/output/F7.pdf  -- Specialty models (8 panels: 6 external + 2 internal-only)"
  supplementary:
    - "paper/manuscript/supplement/S1_equivalence_ledger.md"
    - "paper/manuscript/supplement/S2_capability_inventory.md"
    - "paper/manuscript/supplement/S3_validation_findings.md"
    - "paper/manuscript/supplement/S4_reproducibility_manifest.md"
    - "paper/manuscript/supplement/S5_tolerance_protocol.md"
    - "paper/manuscript/supplement/S6_extended_figures.md"
    - "paper/manuscript/supplement/S7_sensitivity_analyses.md"

